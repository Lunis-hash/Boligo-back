# Blueprint Render — sites statiques BOLIGO :
# - boligo-web : application web (export Expo de mobile-steve/) ;
# - boligo-admin : tableau de bord d'administration (export Next.js de admin/).
# Le service API « Boligo-back » existant n'est pas déclaré ici et n'est pas modifié.
# Création en un clic : https://dashboard.render.com/blueprint/new?repo=https://github.com/Lunis-hash/Boligo-back
services:
  - type: web
    name: boligo-web
    runtime: static
    branch: main
    rootDir: mobile-steve
    buildCommand: npm ci && npx expo export --platform web && cp dist/index.html dist/404.html
    staticPublishPath: dist
    buildFilter:
      paths:
        - mobile-steve/**
    envVars:
      - key: EXPO_PUBLIC_API_URL
        value: https://boligo-back.onrender.com/api
      - key: NODE_VERSION
        value: "22"
    routes:
      # Application monopage expo-router : toute route inconnue renvoie index.html.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # En-têtes de sécurité du site web (A17). Le cadre est interdit dès
      # maintenant (X-Frame-Options) ; la CSP est d'abord en mode « Report-Only »
      # (le navigateur signale les écarts dans la console sans rien bloquer),
      # à passer en « Content-Security-Policy » une fois la console propre.
      # Origines relevées dans le bundle web en ligne : API + WebSocket BOLIGO,
      # adresses (api-adresse / geo.api.gouv.fr, photon.komoot.io, nominatim),
      # jetons de notification Expo (exp.host), sons (assets.mixkit.co).
      # Caméra et micro coupés : l'appel vidéo (Daily) n'existe que dans
      # l'application mobile, pas sur le web ; la géolocalisation reste permise
      # à la page elle-même (choix de la ville).
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(self), payment=(), usb=(), browsing-topics=()
      - path: /*
        name: Content-Security-Policy-Report-Only
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; media-src 'self' data: blob: https://assets.mixkit.co; connect-src 'self' https://boligo-back.onrender.com wss://boligo-back.onrender.com https://api-adresse.data.gouv.fr https://geo.api.gouv.fr https://photon.komoot.io https://nominatim.openstreetmap.org https://exp.host; worker-src 'self' blob:; manifest-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

  - type: web
    name: boligo-admin
    runtime: static
    branch: main
    rootDir: admin
    buildCommand: npm ci && npm run build
    staticPublishPath: out
    buildFilter:
      paths:
        - admin/**
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://boligo-back.onrender.com/api
      - key: NODE_VERSION
        value: "22"
    headers:
      # Espace réservé à l'équipe : pas d'indexation, pas d'affichage dans un
      # cadre, et seule l'API BOLIGO peut être appelée depuis les pages.
      - path: /*
        name: X-Robots-Tag
        value: noindex, nofollow
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://boligo-back.onrender.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
