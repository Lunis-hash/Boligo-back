# Static Site Render (gratuit) pour l'export web BOLIGO.
# Blueprint à appliquer avec « Root Directory = mobile-steve », ou à recopier dans le tableau de bord.
services:
  - type: web
    name: boligo-web
    runtime: static
    rootDir: mobile-steve
    buildCommand: npm ci && npx expo export --platform web && cp dist/index.html dist/404.html
    staticPublishPath: dist
    envVars:
      - key: EXPO_PUBLIC_API_URL
        value: https://boligo-back.onrender.com/api
      - key: NODE_VERSION
        value: "22"
    routes:
      # Application monopage expo-router : toute route inconnue renvoie index.html.
      - type: rewrite
        source: /*
        destination: /index.html
