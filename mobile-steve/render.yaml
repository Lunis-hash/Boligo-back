# Site statique Render (plan gratuit) pour l'export web de l'application Oweke.
# Render ne lit ce fichier que si le dépôt racine est celui de l'app ; depuis
# Boligo-back, définir « Root Directory = mobile-steve » dans le tableau de bord.
services:
  - type: web
    name: oweke-web
    runtime: static
    rootDir: .
    buildCommand: npm ci && npx expo export --platform web
    staticPublishPath: dist
    envVars:
      - key: EXPO_PUBLIC_API_URL
        value: https://boligo-back.onrender.com/api
      - key: NODE_VERSION
        value: "22"
    routes:
      # Application monopage (expo-router) : toute route inconnue renvoie index.html.
      - type: rewrite
        source: /*
        destination: /index.html
