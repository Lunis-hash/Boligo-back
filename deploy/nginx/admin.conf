# Tableau de bord d'administration BOLIGO (export Next.js, trailingSlash).
# En-têtes repris de render.yaml (boligo-admin). Adapter connect-src à l'adresse
# réelle de l'API sur le nouveau serveur.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: http://localhost:3100; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    location / {
        try_files $uri $uri/ $uri.html /404.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
